[project]
name = "aximoe"
version = "0.1.0"
description = "Aximö forecasts OpenTelemetry and Kubernetes container metrics as a band of quantiles"
requires-python = ">=3.12"
dependencies = [
    "torch==2.6.0",
    "numpy==1.26.4",
    "scipy==1.15.3",
    "pandas==2.2.3",
    "pyarrow==25.0.0",
    "httpx==0.28.1",
    "huggingface_hub==0.36.2",
    "mcp==2.3.0",
    "safetensors==0.8.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["python"]
include = ["aximoe*"]
